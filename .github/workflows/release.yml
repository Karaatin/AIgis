name: Release AIgis Chrome Extension

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Check Build Output
        run: ls -R dist

      - name: Create Zip
        run: |
          cd dist
          zip -r ../AIgis-${{ github.ref_name }}.zip .
          cd ..
      
      - name: Generate Checksum
        run: sha256sum AIgis-${{ github.ref_name }}.zip > AIgis-${{ github.ref_name }}.zip.sha256

      - name: List Artifacts
        run: ls -l AIgis-${{ github.ref_name }}.*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AIgis-${{ github.ref_name }}.zip
            AIgis-${{ github.ref_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

